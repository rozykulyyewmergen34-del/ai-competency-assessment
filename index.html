  .progress{

  U={n,id};
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('test-screen').style.display = 'block';
  document.getElementById('fabAi').style.display = 'flex'; 
  intro();
}

function intro(){
 document.getElementById('fabAi').style.display = 'none'; 
 app.innerHTML=`<div class="card center">
 <div class="tag">${T[L].dm}</div>
 <h1>${T[L].t}</h1><p>${T[L].d}</p><p>${T[L].l}</p>
 <button class="glow-btn" onclick="begin()">${T[L].s}</button></div>`;
}

function begin(){
  S={index:0, answers:new Array(18).fill(null)};
  document.getElementById('fabAi').style.display = 'flex'; 
  testQuestions = shuffleArray([...QUESTIONS_DATA]);
  q();
}

function q(){
 let currentQ = testQuestions[S.index];
 const pct = ((S.index) / 18) * 100;
 const dimIndex = S.index % 6;
 
 let dotsHTML = '<div class="dots-container">';
 for(let i=0; i<18; i++) {
     let isAnswered = false;
     if(S.answers[i]) {
         if(S.answers[i].type === 'mcq' && S.answers[i].selected) isAnswered = true;
         if(S.answers[i].type === 'text' && S.answers[i].text && S.answers[i].text.trim() !== '') isAnswered = true;
     }
     let dotClass = 'dot';
     if(i === S.index) dotClass += ' active';
     else if(isAnswered) dotClass += ' answered';
     dotsHTML += `<div class="${dotClass}"></div>`;
 }
 dotsHTML += '</div>';
 
 let html = `<div class="card">
  <div class="tag">Question ${S.index + 1} / 18 · ${T[L].D[dimIndex]}</div>
  ${dotsHTML}
  <div class="progress"><div style="width:${pct}%"></div></div>
  <h2>${currentQ.q}</h2>`;

 if(currentQ.type === 'mcq') {
    let opts = currentQ.o.map((text, index) => ({ text, isCorrect: index === currentQ.a }));
    
    if(!S.answers[S.index]) {
        S.answers[S.index] = { type:'mcq', opts: shuffleArray(opts), selected: null };
    }

    html += `<div id="o"></div>`;
    html += `<div class="nav-buttons">`;
    if(S.index > 0) html += `<button class="btn-prev" onclick="prevQ()">${T[L].btn_prev}</button>`;
    if(S.index < 17) html += `<button class="btn-next" onclick="nextQ()">${T[L].btn_next}</button>`;
    else html += `<button class="btn-submit" onclick="submitTest()">${T[L].btn_sub}</button>`;
    html += `</div></div>`;
    
    app.innerHTML = html;

    const oc=document.getElementById('o');
    S.answers[S.index].opts.forEach((opt, i)=>{
      const b=document.createElement('button');
      b.className = 'opt';
      if(S.answers[S.index].selected === opt.text) b.classList.add('sel');
      
      b.textContent = String.fromCharCode(65+i)+'. '+opt.text;
      b.onclick=()=>{
          S.answers[S.index].selected = opt.text;
          S.answers[S.index].isCorrect = opt.isCorrect;
          q(); 
      };
      oc.appendChild(b);
    });
 } else {
    html += `
      <textarea class="textarea-box" id="textAns" placeholder="${T[L].txt_ph}">${S.answers[S.index] ? S.answers[S.index].text : ''}</textarea>
      <div class="nav-buttons">
        ${S.index > 0 ? `<button class="btn-prev" onclick="prevQ()">${T[L].btn_prev}</button>` : ''}
        ${S.index < 17 ? `<button class="btn-next" onclick="nextQ()">${T[L].btn_next}</button>` : `<button class="btn-submit" onclick="submitTest()">${T[L].btn_sub}</button>`}
      </div>
    </div>`;
    app.innerHTML = html;
 }
}

function prevQ(){
  let currentQ = testQuestions[S.index];
  if(currentQ.type === 'text') {
      let val = document.getElementById('textAns').value;
      S.answers[S.index] = { type:'text', text: val };
  }
  S.index--;
  q();
}

function nextQ(){
  let currentQ = testQuestions[S.index];
  if(currentQ.type === 'text') {
      let val = document.getElementById('textAns').value;
      S.answers[S.index] = { type:'text', text: val };
  }
  S.index++;
  q();
}

function submitTest(){
  let currentQ = testQuestions[S.index];
  if(currentQ.type === 'text') {
      let val = document.getElementById('textAns').value;
      S.answers[S.index] = { type:'text', text: val };
  }
  
  let points = [0,0,0,0,0,0];
  S.answers.forEach((ans, idx) => {
      if(ans) {
          let dim = idx % 6;
          if(ans.type === 'mcq' && ans.isCorrect) points[dim] += 2;
          if(ans.type === 'text' && ans.text && ans.text.trim() !== "") points[dim] += 2;
      }
  });
  
  rep(points);
}

function openAiModal() {
  document.getElementById('aiModal').style.display = 'flex';
  document.getElementById('dsPrompt').value = ""; 
  document.getElementById('aiResponseBox').style.display = 'none';
}

function sendToAI() {
  let prompt = document.getElementById('dsPrompt').value.trim();
  if(!prompt) return;

  let currentQ = testQuestions[S.index];
  let responseBox = document.getElementById('aiResponseBox');
  let responseText = document.getElementById('aiResponseText');

  responseBox.style.display = 'block';
  responseText.innerHTML = "<i>Düşünüyor... (Thinking...)</i>";

  setTimeout(() => {
      if(currentQ.type === 'mcq') {
          let correctLetter = String.fromCharCode(65 + currentQ.a);
          responseText.innerHTML = `<b>Analiz Tamamlandı.</b><br><br>Sorunuzu inceledim. Doğru cevap: <b style="color:#3b82f6; font-size:18px;">${correctLetter}</b>.<br><br><i>Neden?</i> ${currentQ.ans || "Bu seçenek, sorudaki yapay zeka kavramına en uygun tanımı içeriyor."}`;
      } else {
          responseText.innerHTML = `<b>Analiz Tamamlandı.</b><br><br>İşte cevabınız:<br><br>${currentQ.ans || "Açık uçlu sorular için detaylı bir açıklama yapılması gerekir."}`;
      }
  }, 1500); 
}

function closeAiModal() {
  document.getElementById('aiModal').style.display = 'none';
}

function rep(points){
 document.getElementById('fabAi').style.display = 'none'; 
 
 let totalPoints = points.reduce((a,b)=>a+b, 0);
 let sc = points.map(p => Math.round((p / 6) * 100)); 
 let ov = Math.round(totalPoints / 36 * 100);

 let h=`<div class="card center"><div class="tag">${T[L].r}</div><h1>${T[L].p}</h1>
 <p style="font-size:16px;font-weight:bold;color:#fff; margin-top:10px;">${U.n} (${U.id})</p>
 <div class="big">${ov}</div><p>${T[L].o}</p>
 <canvas id="radar" width="300" height="300"></canvas></div>
 <div class="card"><h2>${T[L].b}</h2>`;
 
 sc.forEach((s,i)=>{h+=`<div class="dim"><span>${T[L].D[i]}</span><span><b>${s}</b><span class="bar"><span style="width:${s}%"></span></span></span></div>`;});
 h+=`</div><div class="card"><h2>${T[L].ps}</h2>`;
 
 const srt=sc.map((s,i)=>({s,i})).sort((a,b)=>a.s-b.s).slice(0,2);
 srt.forEach(w=>{h+=`<p><b style="color:#00f0ff;">${T[L].D[w.i]}:</b> ${T[L].tips[w.i]}</p>`;});
 h+=`<button class="glow-btn" style="margin-top:20px;" onclick="location.reload()">${T[L].rt}</button></div>`;
 
 h += `<div class="card center" style="background:rgba(13, 17, 23, 0.85); border:2px solid #00f0ff; padding:15px; box-shadow: 0 0 20px rgba(0,240,255,0.2);">
        <h2 style="color:#00f0ff; font-size:16px; margin-bottom:10px;">Pareto Analysis (Neon)</h2>
        <canvas id="paretoChart" width="350" height="280"></canvas>
       </div>`;

 app.innerHTML=h;
 radar(sc);
 drawPareto(sc); 
}

function drawPareto(sc){
 const c = document.getElementById('paretoChart');
 if(!c) return;
 const ctx = c.getContext('2d');
 const W = c.width, H = c.height;
 
 const pL = 30, pR = 30, pT = 20, pB = 40;
 const cW = W - pL - pR;
 const cH = H - pT - pB;

 ctx.clearRect(0,0,W,H);

 ctx.fillStyle = 'rgba(255, 77, 77, 0.15)'; 
 ctx.fillRect(pL + cW * 0.8, pT, cW * 0.2, cH);
 ctx.fillStyle = 'rgba(0, 255, 136, 0.15)'; 
 ctx.fillRect(pL + cW * 0.5, pT, cW * 0.3, cH);
 ctx.fillStyle = 'rgba(0, 150, 255, 0.15)'; 
 ctx.fillRect(pL, pT, cW * 0.5, cH);

 ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
 for(let i=0; i<=5; i++) {
    let y = pT + cH - (cH * (i/5));
    ctx.beginPath(); ctx.moveTo(pL, y); ctx.lineTo(pL+cW, y); ctx.stroke();
    ctx.fillStyle = '#c9d1d9'; ctx.font = '10px Arial'; ctx.textAlign='right';
    ctx.fillText(i*20, pL-5, y+3);
    ctx.textAlign='left';
    ctx.fillText(i*20 + '%', pL+cW+5, y+3);
 }

 let sortedData = sc.map((score, index) => ({ score, name: T[L].D[index].substring(0,5) }))
                    .sort((a,b) => b.score - a.score);
 
 let barW = (cW / sortedData.length) * 0.6;
 let gap = (cW / sortedData.length) * 0.4;
 
 let cumSum = 0;
 const points = [];

 sortedData.forEach((item, i) => {
    let barH = (item.score / 100) * cH;
    let x = pL + (i * (barW + gap)) + gap/2;
    let y = pT + cH - barH;
    
    ctx.fillStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.fillRect(x, y, barW, barH);
    ctx.strokeStyle = '#00f0ff'; 
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, barW, barH);

    ctx.fillStyle = '#c9d1d9'; ctx.font = '9px Arial'; ctx.textAlign='center';
    ctx.fillText(item.name, x + barW/2, pT + cH + 15);

    cumSum += item.score;
    let cumPct = cumSum / 6; 
    let lineY = pT + cH - (cH * (cumPct / 100));
    points.push({ x: x + barW/2, y: lineY, val: Math.round(cumPct) });
 });

   ctx.beginPath();
 ctx.strokeStyle = '#ff00ff'; 
 ctx.lineWidth = 2;
 ctx.shadowBlur = 10;
 ctx.shadowColor = '#ff00ff';
 points.forEach((p, i) => {
    if(i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
 });
 ctx.stroke();
 ctx.shadowBlur = 0; 

 points.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, 2*Math.PI);
    ctx.fillStyle = '#ff00ff';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
 });
}

function radar(sc){
 const c=document.getElementById('radar'),x=c.getContext('2d'),W=300,H=300,cx=150,cy=150,R=110,n=6;
 x.clearRect(0,0,W,H);
 for(let k=1;k<=4;k++){x.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,r=R*k/4;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py);}x.closePath();x.strokeStyle='rgba(255,255,255,0.1)';x.stroke();}
 for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);x.strokeStyle='rgba(255,255,255,0.1)';x.stroke();}
 x.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,r=R*(sc[i]||0)/100;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py);}
 x.closePath();x.fillStyle='rgba(0,240,255,0.2)';x.fill();x.strokeStyle='#00f0ff';x.lineWidth=2;x.stroke();
 for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,r=R*(sc[i]||0)/100;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;x.beginPath();x.arc(px,py,3.5,0,7);x.fillStyle='#00f0ff';x.fill();}
 x.fillStyle='#c9d1d9';x.font='11px sans-serif';x.textAlign='center';x.textBaseline='middle';
 for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;x.fillText(T[L].D[i],cx+Math.cos(a)*(R+22),cy+Math.sin(a)*(R+22));}
}

setL('en');
</script>
