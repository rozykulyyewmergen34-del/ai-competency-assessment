<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AI Competency Assessment Agent</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a2980);
  background-size: 300% 300%;
  animation: gradientBG 12s ease infinite;
  min-height:100vh;
  color:#333;
  padding:16px;
}
@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.wrap{max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.3);margin-bottom:16px}
h1{font-size:20px;margin:0 0 8px}
h2{font-size:17px;margin:0 0 12px}
p{line-height:1.5;font-size:14px;color:#555}
input[type="text"]{width:100%;padding:14px;border:2px solid #e0e6f0;border-radius:10px;font-size:15px;margin-bottom:12px;font-family:inherit;outline:none;transition:0.2s}
input[type="text"]:focus{border-color:#2a5298}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#2a5298;color:#fff;font-size:15px;font-weight:600;margin-top:10px;cursor:pointer;transition:0.2s}
button:active{transform:scale(.98)}
button.alt{background:#e8eef8;color:#2a5298}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:2px solid #e0e6f0;border-radius:10px;background:#fff;color:#333;font-size:14px;cursor:pointer}
.opt.sel{border-color:#2a5298;background:#e8eef8}
.progress{height:6px;background:#e0e6f0;border-radius:3px;overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:#2a5298;width:0;transition:width .3s}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;background:#e8eef8;color:#2a5298;margin-bottom:8px}
.dim{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.dim:last-child{border:none}
.bar{display:inline-block;height:8px;background:#e0e6f0;border-radius:4px;width:80px;overflow:hidden;vertical-align:middle;margin-left:8px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#2a5298,#4a7bd8);border-radius:4px}
canvas{display:block;margin:0 auto}
.big{font-size:44px;font-weight:700;color:#2a5298;text-align:center;line-height:1}
.center{text-align:center}
.lang-box{display:flex;gap:10px;margin-top:15px}
.lang-box button{width:50%;padding:10px;margin:0;background:#fff;color:#333;border:2px solid #e0e6f0}
.lang-box button.active{background:#2a5298;color:#fff;border-color:#2a5298}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const T={
en:{w:"Welcome",i:"Enter your details",n:"Full Name",id:"Student ID",nx:"Next",dm:"DEMO · AI COMPETENCY AGENT",t:"AI Competency Assessment",d:"This demo assesses 6 AI competency dimensions using an adaptive question engine.",l:"Adaptive logic: correct answer → harder question; wrong answer → easier question.",s:"Start Assessment",r:"ASSESSMENT REPORT",p:"Your AI Competency Profile",o:"Overall Score / 100",b:"Dimension Breakdown",ps:"Personalized Suggestions",rt:"Retake Assessment",D:["Basic AI","Prompt","Tools","Evaluation","Collaboration","Ethics"],tips:["Review fundamental AI concepts.","Practice clear prompts and few-shot examples.","Explore text, image, code generation tools.","Practice verifying AI outputs and spotting bias.","Decompose complex tasks and iterate with AI.","Strengthen AI ethics and privacy protection."]},
cn:{w:"欢迎",i:"请输入您的信息",n:"姓名",id:"学号",nx:"下一步",dm:"演示 · AI 能力评估代理",t:"AI 能力评估",d:"此演示使用自适应问题引擎评估 6 个 AI 能力维度。",l:"自适应逻辑：正确 → 更难；错误 → 更简单。",s:"开始评估",r:"评估报告",p:"您的 AI 能力画像",o:"总分 / 100",b:"维度细分",ps:"个性化建议",rt:"重新评估",D:["AI基础","提示词","工具","评估","协作","伦理"],tips:["复习基本 AI 概念。","练习清晰的提示词和少样本示例。","探索文本、图像、代码生成工具。","练习验证 AI 输出并发现偏见。","分解复杂任务并迭代。","加强 AI 伦理和隐私保护。"]}
};
const Q={
en:[[{q:"What does 'LLM' stand for?",o:["Large Language Model","Linear Learning Machine","Logical Layer Model","Long-term Memory"],a:0},{q:"Which is a typical 'AI hallucination'?",o:["A correct but slow answer","A plausible-sounding but wrong answer","An image with low resolution","A hardware failure"],a:1},{q:"What does 'temperature' mainly control?",o:["Randomness/creativity","Model memory size","Training speed","GPU temperature"],a:0}],[{q:"Which prompt is the clearest?",o:["Tell me about AI","Explain AI to a 10-year-old in 3 sentences","AI???","Write something"],a:1},{q:"What is 'few-shot prompting'?",o:["Asking very few questions","Giving a few examples","Running on few GPUs","Using a short prompt"],a:1},{q:"You need JSON output. Best approach?",o:["Ask politely","Give a schema and explicit format constraints","Use shorter words","Ask the model to guess"],a:1}],[{q:"Which is an AI tool for code generation?",o:["GitHub Copilot","Excel","Notepad","Photoshop"],a:0},{q:"Analyze a 500-row CSV. Best AI workflow?",o:["Paste everything and hope","Use a data-analysis AI tool and ask for a specific metric","Ask the model to memorize it","Skip analysis"],a:1},{q:"To generate images from text, use:",o:["A code editor","A text-to-image model","A spreadsheet","A database"],a:1}],[{q:"AI gives a confident but wrong fact. You should:",o:["Trust it","Verify with a reliable source","Ignore AI forever","Copy it directly"],a:1},{q:"Reduce hallucinations by:",o:["Asking to cite sources and verify","Increasing temperature","Asking vaguely","Shorter prompts"],a:0},{q:"Notice biased output. Best action?",o:["Publish it","Flag it and ask for balanced alternatives","Ignore it","Increase speed"],a:1}],[{q:"Human-AI collaboration means:",o:["AI does everything","Human and AI split tasks by strength","Human does nothing","AI replaces human"],a:1},{q:"Best way to complete complex task with AI?",o:["One huge prompt","Decompose into steps, review each output","Ask AI to do it all","Skip planning"],a:1},{q:"AI output partially wrong. Best step?",o:["Restart everything","Give corrective feedback and iterate","Submit as is","Delete project"],a:1}],[{q:"Before pasting personal data into AI:",o:["Paste it anyway","Remove/anonymize data first","Share password","Ignore privacy"],a:1},{q:"AI content used commercially must consider:",o:["Only speed","Copyright and license terms","Only length","Only language"],a:1},{q:"Responsible AI usage includes:",o:["Hiding AI involvement","Transparency and human review","Removing all citations","Using AI for everything"],a:1}]],
cn:[[{q:"'LLM'代表什么？",o:["大型语言模型","线性学习机","逻辑层模型","长期记忆"],a:0},{q:"什么是典型的“AI幻觉”？",o:["正确但缓慢的答案","听起来合理但事实错误的答案","低分辨率图像","硬件故障"],a:1},{q:"“温度”参数主要控制什么？",o:["随机性/创造力","模型内存大小","训练速度","GPU温度"],a:0}],[{q:"哪个提示词最清晰？",o:["告诉我关于AI的事","用3句话向10岁孩子解释AI","AI???","写点什么"],a:1},{q:"什么是“少样本提示”？",o:["问很少的问题","给出几个示例","在少数GPU上运行","使用短提示"],a:1},{q:"需要JSON输出。最佳方法？",o:["礼貌请求","给出Schema和明确的格式约束","使用更短的词","让模型猜"],a:1}],[{q:"哪个是代码生成AI工具？",o:["GitHub Copilot","Excel","Notepad","Photoshop"],a:0},{q:"分析500行CSV。最佳工作流？",o:["粘贴所有内容并祈祷","使用数据分析工具并询问具体指标","让模型记住","跳过分析"],a:1},{q:"从文本生成图像，使用：",o:["代码编辑器","文生图模型","电子表格","数据库"],a:1}],[{q:"AI给出自信但错误的事实。你应该：",o:["相信它","通过可靠来源验证","永远忽略AI","直接复制"],a:1},{q:"减少幻觉的方法：",o:["要求引用来源并验证","增加温度","模糊提问","使用短提示"],a:0},{q:"发现AI输出有偏见。最佳行动？",o:["发布它","标记并要求平衡的替代方案","忽略它","提高速度"],a:1}],[{q:"人机协作意味着：",o:["AI做所有事","人类和AI按优势分工","人类什么都不做","AI取代人类"],a:1},{q:"用AI完成复杂任务的最佳方法？",o:["一个巨大的提示词","分解步骤，审查每个输出","让AI一次完成","跳过计划"],a:1},{q:"AI输出部分错误。最佳步骤？",o:["重新开始","提供纠正反馈并迭代","直接提交","删除项目"],a:1}],[{q:"将个人数据粘贴到AI之前：",o:["直接粘贴","首先匿名化/删除数据","分享密码","忽略隐私"],a:1},{q:"商业使用的AI生成内容必须考虑：",o:["只考虑速度","版权和许可条款","只考虑长度","只考虑语言"],a:1},{q:"负责任的AI使用包括：",o:["隐藏AI参与","AI使用的透明度和人工审查","删除所有引用","使用AI做所有事"],a:1}]]};

const app=document.getElementById('app');
let L='en', U={n:'',id:''}, S={d:0,l:2,ak:[],p:[0,0,0,0,0,0]};

function langSel(){
 app.innerHTML=`<div class="card center"><div class="tag">${T[L].dm}</div><h1>${T[L].w}</h1><p>${T[L].i}</p>
 <div class="lang-box">
   <button class="${L==='en'?'active':''}" onclick="setL('en')">EN</button>
   <button class="${L==='cn'?'active':''}" onclick="setL('cn')">CN</button>
 </div></div>`;
}
function setL(l){L=l;userInfo();}
function userInfo(){
 app.innerHTML=`<div class="card center"><div class="tag">${T[L].dm}</div><h1>${T[L].i}</h1>
 <input type="text" id="uName" placeholder="${T[L].n}" value="${U.n}">
 <input type="text" id="uId" placeholder="${T[L].id}" value="${U.id}">
 <button onclick="saveInfo()">${T[L].nx}</button></div>`;
}
function saveInfo(){
 const n=document.getElementById('uName').value;const id=document.getElementById('uId').value;
 if(!n||!id)return alert("Please fill all fields");
 U={n,id};intro();
}
function intro(){
 app.innerHTML=`<div class="card"><div class="tag">${T[L].dm}</div><h1>${T[L].t}</h1><p>${T[L].d}</p><p><b>Adaptive logic:</b> ${T[L].l}</p>
 <button onclick="begin()">${T[L].s}</button></div>`;
}
function begin(){S={d:0,l:2,ak:[],p:[0,0,0,0,0,0]};q();}

function q(){
 if(S.d>=6)return rep(); // Pratik görevi atlayıp direkt rapora gider
 let l=S.l;
 if(S.ak.includes(l)){const r=[1,2,3].filter(x=>!S.ak.includes(x));if(!r.length){S.d++;S.ak=[];S.l=2;return q();}l=r[0];}
 const Qs=Q[L][S.d];const quest=Qs[l-1];S.ak.push(l);S.l=l;
 const pct=((S.d*3+S.ak.length)/18)*100;
 app.innerHTML=`<div class="card"><div class="tag">Dimension ${S.d+1}/6 · ${T[L].D[S.d]}</div>
 <div class="progress"><div style="width:${pct}%"></div></div><h2>${quest.q}</h2><div id="o"></div></div>`;
 const oc=document.getElementById('o');
 quest.o.forEach((t,i)=>{
  const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+t;
  b.onclick=()=>{if(oc.dataset.k)return;oc.dataset.k=1;b.classList.add('sel');setTimeout(()=>ans(i===quest.a,l),200);};oc.appendChild(b);
 });
}
function ans(c,l){if(c)S.p[S.d]+=l;let n=c?l+1:l-1;if(n<1)n=1;if(n>3)n=3;S.l=n;if(S.ak.length>=3){S.d++;S.ak=[];S.l=2;}q();}

function rep(){
 const sc=S.p.map(p=>Math.round(p/6*100));const ov=Math.round(sc.reduce((a,b)=>a+b,0)/6);
 let h=`<div class="card center"><div class="tag">${T[L].r}</div><h1>${T[L].p}</h1>
 <p style="font-size:16px;font-weight:bold;color:#2a5298;">${U.n} (${U.id})</p>
 <div class="big">${ov}</div><p>${T[L].o}</p><canvas id="radar" width="300" height="300"></canvas></div>
 <div class="card"><h2>${T[L].b}</h2>`;
 sc.forEach((s,i)=>{h+=`<div class="dim"><span>${T[L].D[i]}</span><span><b>${s}</b><span class="bar"><span style="width:${s}%"></span></span></span></div>`;});
 h+=`</div><div class="card"><h2>${T[L].ps}</h2>`;
 const srt=sc.map((s,i)=>({s,i})).sort((a,b)=>a.s-b.s).slice(0,2);
 srt.forEach(w=>{h+=`<p><b>${T[L].D[w.i]}:</b> ${T[L].tips[w.i]}</p>`;});
 h+=`<button class="alt" onclick="intro()">${T[L].rt}</button></div>`;
 app.innerHTML=h;radar(sc);
}
function radar(sc){
 const c=document.getElementById('radar'),x=c.getContext('2d'),W=300,H=300,cx=150,cy=150,R=110,n=6;
 x.clearRect(0,0,W,H);
 for(let k=1;k<=4;k++){x.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,r=R*k/4;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py);}x.closePath();x.strokeStyle='#dbe3f0';x.stroke();}
 for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);x.strokeStyle='#dbe3f0';x.stroke();}
 x.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,r=R*(sc[i]||0)/100;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py);}
 x.closePath();x.fillStyle='rgba(42,82,152,.25)';x.fill();x.strokeStyle='#2a5298';x.lineWidth=2;x.stroke();
 x.fillStyle='#333';x.font='11px sans-serif';x.textAlign='center';x.textBaseline='middle';
 for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;x.fillText(T[L].D[i],cx+Math.cos(a)*(R+22),cy+Math.sin(a)*(R+22));}
}
langSel();
</script>
</body>
</html>
